<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: background fills entire canvas, content inside 80% safe zone -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed amber background (no rounded corners for maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- House scaled ~80% and centered to fit safe zone (51-461px) -->
  <!-- Safe zone center: 256,256 | content area: ~410x410 -->
  <g transform="translate(256,262) scale(0.78) translate(-256,-262)">
    <!-- House roof -->
    <polygon points="256,80 88,236 424,236" fill="white"/>
    <!-- House body -->
    <rect x="120" y="228" width="272" height="216" fill="white"/>
    <!-- Door -->
    <rect x="210" y="338" width="92" height="106" rx="10" fill="#d97706"/>
    <circle cx="288" cy="394" r="7" fill="white" opacity="0.55"/>
    <!-- Left window -->
    <rect x="142" y="262" width="72" height="58" rx="7" fill="#f59e0b"/>
    <rect x="176" y="262" width="4" height="58" fill="white" opacity="0.45"/>
    <rect x="142" y="289" width="72" height="4" fill="white" opacity="0.45"/>
    <!-- Right window -->
    <rect x="298" y="262" width="72" height="58" rx="7" fill="#f59e0b"/>
    <rect x="332" y="262" width="4" height="58" fill="white" opacity="0.45"/>
    <rect x="298" y="289" width="72" height="4" fill="white" opacity="0.45"/>
    <!-- Clipboard badge -->
    <rect x="316" y="354" width="66" height="78" rx="10" fill="#92400e"/>
    <rect x="320" y="358" width="58" height="70" rx="8" fill="#fef3c7"/>
    <rect x="332" y="352" width="34" height="14" rx="4" fill="#92400e"/>
    <rect x="328" y="376" width="36" height="4" rx="2" fill="#d97706" opacity="0.7"/>
    <rect x="328" y="386" width="30" height="4" rx="2" fill="#d97706" opacity="0.55"/>
    <rect x="328" y="396" width="34" height="4" rx="2" fill="#d97706" opacity="0.7"/>
    <path d="M333 410 L339 416 L351 404" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
