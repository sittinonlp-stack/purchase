<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed emerald background (maskable, no rounded corners) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Content scaled ~78% into the safe zone -->
  <g transform="translate(256,262) scale(0.78) translate(-256,-262)">
    <!-- House roof -->
    <polygon points="256,112 112,244 400,244" fill="#ffffff"/>
    <!-- House body -->
    <rect x="150" y="238" width="212" height="152" rx="6" fill="#ffffff"/>
    <!-- Door -->
    <rect x="228" y="316" width="56" height="74" rx="8" fill="#059669"/>
    <circle cx="272" cy="356" r="6" fill="#ffffff" opacity="0.6"/>
    <!-- Windows -->
    <rect x="178" y="266" width="48" height="40" rx="6" fill="#34d399"/>
    <rect x="286" y="266" width="48" height="40" rx="6" fill="#34d399"/>
    <!-- Cost baht coin -->
    <circle cx="376" cy="378" r="62" fill="#f59e0b"/>
    <circle cx="376" cy="378" r="62" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.35"/>
    <text x="376" y="380" text-anchor="middle" dominant-baseline="central" font-family="'Prompt','Segoe UI',Tahoma,sans-serif" font-size="76" font-weight="700" fill="#ffffff">฿</text>
  </g>
</svg>
