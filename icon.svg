<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="roof" x1="256" y1="76" x2="256" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Shadow layer for depth -->
  <polygon points="256,96 92,244 420,244" fill="black" opacity="0.08"/>
  <rect x="120" y="236" width="272" height="216" rx="4" fill="black" opacity="0.06"/>

  <!-- House roof (triangle) -->
  <polygon points="256,80 88,236 424,236" fill="url(#roof)"/>

  <!-- House body -->
  <rect x="120" y="228" width="272" height="216" fill="white"/>

  <!-- Door (amber cutout) -->
  <rect x="210" y="338" width="92" height="106" rx="10" fill="#d97706"/>
  <!-- Door highlight top -->
  <rect x="210" y="338" width="92" height="8" rx="5" fill="white" opacity="0.25"/>
  <!-- Door knob -->
  <circle cx="288" cy="394" r="7" fill="white" opacity="0.55"/>

  <!-- Left window (amber) -->
  <rect x="142" y="262" width="72" height="58" rx="7" fill="#f59e0b"/>
  <!-- Left window cross - vertical -->
  <rect x="176" y="262" width="4" height="58" fill="white" opacity="0.45"/>
  <!-- Left window cross - horizontal -->
  <rect x="142" y="289" width="72" height="4" fill="white" opacity="0.45"/>
  <!-- Left window glare -->
  <rect x="146" y="266" width="26" height="18" rx="3" fill="white" opacity="0.18"/>

  <!-- Right window (amber) -->
  <rect x="298" y="262" width="72" height="58" rx="7" fill="#f59e0b"/>
  <!-- Right window cross - vertical -->
  <rect x="332" y="262" width="4" height="58" fill="white" opacity="0.45"/>
  <!-- Right window cross - horizontal -->
  <rect x="298" y="289" width="72" height="4" fill="white" opacity="0.45"/>
  <!-- Right window glare -->
  <rect x="302" y="266" width="26" height="18" rx="3" fill="white" opacity="0.18"/>

  <!-- Roof ridge cap -->
  <circle cx="256" cy="80" r="10" fill="white" opacity="0.6"/>

  <!-- Small clipboard badge (bottom-right corner) — represents "purchase record" -->
  <rect x="316" y="354" width="66" height="78" rx="10" fill="#92400e"/>
  <rect x="320" y="358" width="58" height="70" rx="8" fill="#fef3c7"/>
  <!-- Clipboard header -->
  <rect x="332" y="352" width="34" height="14" rx="4" fill="#92400e"/>
  <!-- Clipboard lines -->
  <rect x="328" y="376" width="36" height="4" rx="2" fill="#d97706" opacity="0.7"/>
  <rect x="328" y="386" width="30" height="4" rx="2" fill="#d97706" opacity="0.55"/>
  <rect x="328" y="396" width="34" height="4" rx="2" fill="#d97706" opacity="0.7"/>
  <!-- Checkmark -->
  <path d="M333 410 L339 416 L351 404" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
