<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (emerald) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Soft shadow under house -->
  <polygon points="256,116 116,248 396,248" fill="black" opacity="0.06"/>
  <rect x="150" y="242" width="212" height="150" rx="6" fill="black" opacity="0.05"/>

  <!-- House roof -->
  <polygon points="256,112 112,244 400,244" fill="#ffffff"/>
  <!-- House body -->
  <rect x="150" y="238" width="212" height="152" rx="6" fill="#ffffff"/>
  <!-- Door (emerald cutout) -->
  <rect x="228" y="316" width="56" height="74" rx="8" fill="#059669"/>
  <circle cx="272" cy="356" r="6" fill="#ffffff" opacity="0.6"/>
  <!-- Left window -->
  <rect x="178" y="266" width="48" height="40" rx="6" fill="#34d399"/>
  <!-- Right window -->
  <rect x="286" y="266" width="48" height="40" rx="6" fill="#34d399"/>
  <!-- Roof ridge cap -->
  <circle cx="256" cy="112" r="9" fill="#ffffff" opacity="0.55"/>

  <!-- Cost baht coin (bottom-right) — represents "คุมต้นทุน / เงิน" -->
  <circle cx="376" cy="378" r="62" fill="#f59e0b"/>
  <circle cx="376" cy="378" r="62" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.35"/>
  <text x="376" y="380" text-anchor="middle" dominant-baseline="central" font-family="'Prompt','Segoe UI',Tahoma,sans-serif" font-size="76" font-weight="700" fill="#ffffff">฿</text>
</svg>
