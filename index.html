<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>จัดซื้อ — ระบบบันทึกการจัดซื้องานรับเหมาก่อสร้าง</title>

<!-- ── PWA Meta Tags ───────────────────────────────────────── -->
<!-- Web App Manifest (Android / Desktop Chrome) -->
<link rel="manifest" href="/manifest.json" />

<!-- Theme color (address bar / status bar) -->
<meta name="theme-color" content="#d97706" />

<!-- iOS Safari — เพิ่มไอคอนบน Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="จัดซื้อ" />
<link rel="apple-touch-icon" href="/icon.svg" />

<!-- Microsoft Tiles (Edge / Windows) -->
<meta name="msapplication-TileColor" content="#d97706" />
<meta name="msapplication-TileImage" content="/icon.svg" />

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<!-- ──────────────────────────────────────────────────────────── -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<!-- React + Babel (CDN) — ใช้ production build (เล็กกว่า/เร็วกว่า dev) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Supabase JS (CDN) — must load before config/db -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Supabase setup (plain JS — must run before JSX store.jsx) -->
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="db.js"></script>

<!-- SheetJS — Excel export (community edition) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- App (JSX via Babel) -->
<script type="text/babel" data-presets="react" src="store.jsx"></script>
<script type="text/babel" data-presets="react" src="auth-ui.jsx"></script>
<script type="text/babel" data-presets="react" src="ui.jsx"></script>
<script type="text/babel" data-presets="react" src="forms.jsx"></script>
<script type="text/babel" data-presets="react" src="labor.jsx"></script>
<script type="text/babel" data-presets="react" src="receipt.jsx"></script>
<script type="text/babel" data-presets="react" src="views.jsx"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>

<!-- ── Service Worker Registration (PWA) ──────────────────── -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then((reg) => console.log('[SW] Registered, scope:', reg.scope))
      .catch((err) => console.warn('[SW] Registration failed:', err));
  });
}
</script>
<!-- ─────────────────────────────────────────────────────────── -->
</body>
</html>
